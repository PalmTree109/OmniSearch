<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSearch - Universal Search Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center py-12 px-4">

    <div class="w-full max-w-3xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2">OmniSearch</h1>
            <p class="text-slate-400">Universal search & deep-scraping engine</p>
        </div>

        <!-- Search Form -->
        <form id="search-form" class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-xl flex flex-col gap-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Enter keywords (e.g., f4m, soccer, python)..." 
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                    required
                >
                <input 
                    type="text" 
                    id="site-input" 
                    placeholder="Target site (e.g., wikipedia.org)" 
                    class="sm:w-64 bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                    required
                >
            </div>
            <button 
                type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition-colors shadow-lg"
            >
                Search Engine
            </button>
        </form>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-12 text-slate-400">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent mb-3"></div>
            <p>Scanning domain & aggregating results...</p>
        </div>

        <!-- Results Container -->
        <div id="results-container" class="mt-8 space-y-4"></div>

        <!-- Pagination Controls -->
        <div id="pagination" class="hidden flex justify-between items-center mt-8 pt-4 border-t border-slate-800">
            <button id="prev-btn" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 px-4 py-2 rounded-lg text-sm text-slate-300 disabled:opacity-50">Previous</button>
            <span id="page-info" class="text-sm text-slate-400">Page 1 of 1</span>
            <button id="next-btn" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 px-4 py-2 rounded-lg text-sm text-slate-300 disabled:opacity-50">Next</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const siteInput = document.getElementById('site-input');
        const loading = document.getElementById('loading');
        const resultsContainer = document.getElementById('results-container');
        const pagination = document.getElementById('pagination');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageInfo = document.getElementById('page-info');

        let allResults = [];
        let currentPage = 1;
        const resultsPerPage = 10;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            const site = siteInput.value.trim();

            if (!query || !site) return;

            loading.classList.remove('hidden');
            resultsContainer.innerHTML = '';
            pagination.classList.add('hidden');

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&site=${encodeURIComponent(site)}`);
                const data = await response.json();
                
                allResults = data.results || [];
                currentPage = 1;
                renderResults();
            } catch (err) {
                resultsContainer.innerHTML = `<div class="bg-red-950/50 border border-red-900 p-4 rounded-lg text-red-300">Failed to fetch search results.</div>`;
            } finally {
                loading.classList.add('hidden');
            }
        });

        function renderResults() {
            resultsContainer.innerHTML = '';

            if (allResults.length === 0) {
                resultsContainer.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-4 rounded-lg text-slate-400 text-center">No results found.</div>`;
                pagination.classList.add('hidden');
                return;
            }

            const startIndex = (currentPage - 1) * resultsPerPage;
            const endIndex = startIndex + resultsPerPage;
            const paginatedItems = allResults.slice(startIndex, endIndex);

            paginatedItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition-all';
                card.innerHTML = `
                    <h3 class="text-lg font-semibold mb-1">
                        <a href="${item.url}" target="_blank" class="text-indigo-400 hover:underline">${item.title}</a>
                    </h3>
                    <p class="text-xs text-slate-500 mb-2 truncate">${item.url}</p>
                    <p class="text-slate-300 text-sm">${item.snippet}</p>
                `;
                resultsContainer.appendChild(card);
            });

            // Update pagination controls
            const totalPages = Math.ceil(allResults.length / resultsPerPage);
            if (totalPages > 1) {
                pagination.classList.remove('hidden');
                pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage === totalPages;
            } else {
                pagination.classList.add('hidden');
            }
        }

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderResults();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(allResults.length / resultsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderResults();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    </script>
</body>
</html>
